name: Build and deploy game release calendar

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/**"
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Denver"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build calendar
        run: python scripts/build_calendar.py

      - name: Validate calendar
        run: python scripts/validate_calendar.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
