name: Build, update, and deploy game release calendar

on:
  workflow_dispatch:
 schedule:
    - cron: "17 8 * * *"
      timezone: "America/Denver"

    - cron: "47 10 * * *"
      timezone: "America/Denver"
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/**"
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update release data from IGDB
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_MAX_NEW_EVENTS: "5000"
        run: python scripts/update_from_igdb.py

      - name: Build calendar
        run: python scripts/build_calendar.py

      - name: Validate calendar
        run: python scripts/validate_calendar.py

      - name: Commit synchronized calendar data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json data/metadata.json game-releases.ics
          if git diff --cached --quiet; then
            echo "No release-data changes to commit."
          else
            git commit -m "chore: sync game release calendar from IGDB"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
